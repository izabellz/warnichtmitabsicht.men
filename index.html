<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War nicht mit Absicht</title>

<style>
body{
    background: linear-gradient(135deg,#111,#222);
    color:white;
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.box{
    background:#1e1e1e;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    text-align:center;
    max-width:600px;
}

h1{
    margin-bottom:20px;
}

p{
    line-height:1.5;
}

.option{
    margin:15px;
    font-size:24px;
}

label{
    margin-left:10px;
}
</style>
</head>
<body>

<div class="box">
    <h1>Es tut mir leid. ❤️</h1>

    <p>
        Ich weiß, dass ich Mist gebaut habe.
        Das war nicht meine Absicht und ich bereue es wirklich.
        Mehr kann ich leider nicht tun, außer ehrlich zu sagen:
        Es tut mir leid.
    </p>

    <h2>Verzeihst du mir?</h2>

    <div class="option">
        <input type="checkbox" checked>
        <label>Ja</label>
    </div>

    <div class="option">
        <input type="checkbox" disabled>
        <label style="color:gray;">Nein</label>
    </div>

    <p style="font-size:12px;color:#999;">
        Andere Antworten werden derzeit leider nicht unterstützt.
    </p>

</div>

</body>
</html>
