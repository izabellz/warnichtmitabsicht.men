<h1>🤨 Wieso bist du wieder hier?</h1>
<p>Kann ich dir helfen?</p>

<button onclick="showForm()">
    Ja, bitte
</button>

<div id="form" style="display:none; margin-top:20px;">
    <h2>Bevor ich helfen kann:</h2>

    <p>Wie oft bist du bereits auf dieser Website gewesen?</p>

    <input type="radio" id="einmal" name="besuch">
    <label for="einmal">Einmal</label><br><br>

    <input type="radio" id="mehrmals" name="besuch">
    <label for="mehrmals">Mehrmals</label><br><br>

    <input type="radio" id="ja" name="besuch">
    <label for="ja">Ja</label><br><br>

    <button onclick="submitAnswer()">
        Absenden
    </button>
</div>

<p id="result"></p>

<script>
function showForm() {
    document.getElementById("form").style.display = "block";
}

function submitAnswer() {
    document.getElementById("result").innerHTML =
      "✅ Vielen Dank für deine Ehrlichkeit.<br><br>Deine Antwort wurde erfolgreich ignoriert.";
}
</script>
