<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War nicht mit Absicht</title>

<style>
body{
    background: linear-gradient(135deg,#111,#222);
    color:white;
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.box{
    background:#1e1e1e;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    text-align:center;
}

h1{
    margin-bottom:30px;
}

.option{
    margin:15px;
    font-size:24px;
}

label{
    margin-left:10px;
}
</style>
</head>
<body>

<div class="box">
    <h1>Verzeihst du mir?</h1>

    <div class="option">
        <input type="checkbox" checked>
        <label>Ja</label>
    </div>

    <div class="option">
        <input type="checkbox" disabled>
        <label style="color:gray;">Nein</label>
    </div>

    <p>Andere Antworten werden derzeit leider nicht unterstützt.</p>
</div>

</body>
</html>
